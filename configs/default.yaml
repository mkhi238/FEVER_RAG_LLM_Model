# ClaimScan config root. Every path and model name the package uses comes from here.
# Override the file with CLAIMSCAN_CONFIG=/path/to/other.yaml, or single values with the
# env vars noted below.

# Where the 147 GB of data / FAISS / verifier artifacts live. Env: CLAIMSCAN_ARTIFACTS
artifacts_root: /mnt/d/crisis-claim-analysis/artifacts

# HuggingFace cache (bge-small and deberta-v3-base are already downloaded here).
# Only applied if HF_HOME is not already set. Set to null to leave HF_HOME alone.
hf_home: /mnt/d/huggingface_cache

# Relative paths below are resolved against artifacts_root.
paths:
  data_processed: data/processed
  claims_file: data/processed/fever_claims_parquet
  gold_file: data/processed/fever_gold.json
  corpus: data/processed/fever_corpus_parquet
  evidence: data/processed/fever_evidence_parquet
  retriever_index_dir: dense/faiss_bge_small_en_v1_5
  verifier_output_dir: verifier/deberta_v1
  verifier_training_data: verifier/deberta_v1/training_data.json/training_data.json
  mlflow_tracking_uri: mlruns

retriever:
  model: BAAI/bge-small-en-v1.5
  index_file: faiss_index_175.bin
  docids_file: all_docids_175.csv
  nprobe: 64

# Every dense FAISS index under artifacts_root/dense. faiss_embeddings.py and faiss_indexer.py
# build any of them with --index <name>; the retriever above uses bge_small.
# State on D: (2026-11-11): bge_small and minilm have 253 shards + faiss_index_175.bin;
# e5_base has shards 1-56 only (shard 0 missing, no index built).
dense_indexes:
  bge_small:
    model: BAAI/bge-small-en-v1.5
    dir: dense/faiss_bge_small_en_v1_5
    dim: 384
  minilm:
    model: sentence-transformers/all-MiniLM-L6-v2
    dir: dense/faiss_all_minilm_l6_v2
    dim: 384
  e5_base:
    model: intfloat/e5-base-v2
    dir: dense/faiss_e5_base_v2
    dim: 768
default_dense_index: bge_small

verifier:
  model: microsoft/deberta-v3-base
  batch_size: 8
  learning_rate: 2.0e-5
  num_epochs: 3
  max_length: 512
  warmup_steps: 500
  negative_samples_per_claim: 1
  max_evidence_sentences: 3
  eval_batch_size: 32
  num_labels: 3

mlflow_experiment_name: fever_verifier
