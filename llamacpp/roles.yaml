# One entry per LLM role (ClaimScan plan: "one config per LLM role").
# backend: llamacpp -> started by llamacpp/scripts/serve.sh, reached at http://127.0.0.1:<port>/v1
# backend: hosted   -> base_url + model + the API key read from env var api_key_env (never write keys here)
# Model filenames are TODO until Step 2 of llamacpp/README.md.

llama_server: /mnt/e/llm/llama.cpp/build/bin/llama-server
models_dir: /mnt/e/llm/models

roles:
  research_agent:
    backend: llamacpp
    model: TODO-Qwen3-4B-Q4_K_M.gguf
    port: 8081
    ctx: 8192
    n_gpu_layers: 99
    grammar: llamacpp/grammars/research_action.gbnf
    lora: null            # SFT adapter later

  reranker:
    backend: llamacpp
    model: TODO-Qwen3-Reranker-0.6B-Q8_0.gguf
    port: 8082
    ctx: 4096
    n_gpu_layers: 99
    reranking: true

  # Front: ONE llama-server running Qwen3.5-9B (dense, not MoE; Qwen's smallest MoE is 35B-A3B).
  # Q4_K_M ~5.5 GB: some layers on the GPU, the rest in RAM. The decomposer reuses this server.
  # Not built yet; the aggregator (rear) runs its own Gemma server below.
  front_facer:
    backend: llamacpp
    model: TODO-Qwen3.5-9B-Q4_K_M.gguf   # check the exact file name in unsloth/Qwen3.5-9B-GGUF
    port: 8085
    ctx: 8192
    n_gpu_layers: TODO                # raise until VRAM is full (the research agent + reranker need ~3 GB too)
    jinja: true                       # use the model's own chat template
    enable_thinking: false            # if Qwen3.5 thinks by default, turn it off so JSON output stays clean
                                      # (per request: chat_template_kwargs={"enable_thinking": false})

  decomposer:
    backend: llamacpp
    shares: front_facer               # same server/port; JSON output via response_format json_schema

  # Rear: Gemma reads the verifier's verdict + evidence and may veto it to NEI (claimscan/instruct/rear_aggregator.py).
  # The API reads this port (claimscan/instruct/chat_clients.py). docker-compose's LLAMA_PORT default (8083) must match it.
  aggregator:
    backend: llamacpp
    model: TODO-gemma-3-4b-it-Q4_K_M.gguf   # ~2.5 GB; gemma-3-1b-it is the CPU-only fallback
    hf_model: google/gemma-3-4b-it    # the same model as HF weights: claimscan/instruct/posttraining.py trains this one
    port: 8083
    ctx: 4096                         # top-5 evidence + prompt + a short JSON answer fit easily
    n_gpu_layers: TODO                # 99 if VRAM is free, else lower (0 = CPU only)
    jinja: true                       # Gemma's own chat template (it folds the system prompt into the first user turn)
                                      # JSON output: response_format json_schema, sent by LangChain's with_structured_output
